services:
  pool:
    build:
      context: .
    init: true
    restart: unless-stopped
    # The daemon, wallet API, and Redis already run on host loopback. Host
    # networking gives the container the same connectivity as `node init.js`.
    network_mode: host
    environment:
      REDIS_HOST: 127.0.0.1
      DAEMON_HOST: 127.0.0.1
      WALLET_HOST: 127.0.0.1
      WALLET_DAEMON_HOST: 127.0.0.1
    volumes:
      - ./config.json:/config/config.json:ro
      - pool-logs:/app/logs

volumes:
  pool-logs:
